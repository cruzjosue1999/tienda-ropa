<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>{{ store_name }}</title>
<meta name="description" content="{{ store_name }} - Compra en línea">
<meta name="theme-color" content="#0a2a5e">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ store_name }}">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="brand-bar">
  <div class="brand">
    <img src="/static/logo.webp" alt="Tu Nuevo Estilo" class="brand-logo">
    <div>
      <h1 id="store-name">{{ store_name }}</h1>
      <p id="store-tagline" class="tagline"></p>
    </div>
  </div>
  <button id="cart-btn" class="cart-btn" aria-label="Ver carrito">🛒 <span id="cart-count">0</span></button>
</header>

<nav class="info-nav" aria-label="Información de la tienda">
  <button data-info="info_horarios">Horarios</button>
  <button data-info="info_ubicacion">Ubicación</button>
  <button data-info="info_contacto">Contáctenos</button>
  <button data-info="info_pagos">Pagos</button>
  <button data-info="info_envios">Envíos</button>
</nav>

<main>
  <div id="notice" class="notice hidden"></div>

  <section class="hero" aria-label="Destacado">
    <div class="hero-text">
      <h2 id="hero-title">{{ store_name }}</h2>
      <p id="hero-sub" class="tagline"></p>
      <a href="#catalogo" class="btn-hero">COMPRAR AHORA</a>
    </div>
  </section>

  <section class="cat-section" aria-label="Categorías">
    <h2 class="section-title">Categorías</h2>
    <div id="cat-pills" class="cat-pills"></div>
  </section>

  <section id="catalogo" aria-label="Productos">
    <h2 class="section-title" id="catalog-title">Novedades</h2>
    <div id="catalog" class="grid" aria-live="polite">
      <p class="loading">Cargando productos…</p>
    </div>
  </section>
</main>

<footer class="store-foot">
  <h3 id="foot-name">{{ store_name }}</h3>
  <p id="foot-tagline" class="tagline"></p>
  <p id="foot-envios" class="foot-line"></p>
</footer>

<div id="info-modal" class="modal hidden" role="dialog" aria-label="Información">
  <div class="modal-card info-card">
    <div class="drawer-head">
      <h2 id="info-title"></h2>
      <button id="info-close" class="icon-btn" aria-label="Cerrar">✕</button>
    </div>
    <p id="info-body" class="info-body"></p>
  </div>
</div>

<div id="pdetail" class="modal hidden" role="dialog" aria-label="Detalle del producto">
  <div class="modal-card pdetail-card">
    <div class="drawer-head">
      <h2 id="pdetail-title"></h2>
      <button id="pdetail-close" class="icon-btn" aria-label="Cerrar">✕</button>
    </div>
    <div id="pdetail-body" class="pdetail-body"></div>
  </div>
</div>

<div id="photo-viewer" class="photo-viewer hidden" role="dialog" aria-label="Ver foto del producto">
  <button id="photo-viewer-close" class="icon-btn photo-viewer-close" aria-label="Cerrar">✕</button>
  <div id="photo-viewer-stage" class="photo-viewer-stage">
    <img id="photo-viewer-img" alt="Foto del producto" draggable="false">
  </div>
  <button id="pv-prev" class="pv-nav" aria-label="Foto anterior">‹</button>
  <button id="pv-next" class="pv-nav" aria-label="Foto siguiente">›</button>
  <p class="photo-hint">Pellizca para acercar · Arrastra para mover · Toca el fondo para cerrar</p>
</div>

<div id="cart-drawer" class="drawer hidden" role="dialog" aria-label="Carrito">
  <div class="drawer-head">
    <h2>Tu carrito</h2>
    <button id="cart-close" class="icon-btn" aria-label="Cerrar">✕</button>
  </div>
  <div class="drawer-body">
    <div id="cart-items" class="cart-items"></div>
    <div class="delivery-form">
      <h3>📦 Datos de entrega</h3>
      <input id="cust-name" type="text" placeholder="Nombre completo" autocomplete="name" maxlength="120">
      <input id="cust-address" type="text" placeholder="Dirección (colonia, calle, referencia)" autocomplete="street-address" maxlength="200">
      <div class="form-row">
        <input id="cust-city" type="text" placeholder="Ciudad" autocomplete="address-level2" maxlength="80">
        <select id="cust-department" aria-label="Departamento">
          <option value="">Departamento…</option>
          <option>Atlántida</option>
          <option>Choluteca</option>
          <option>Colón</option>
          <option>Comayagua</option>
          <option>Copán</option>
          <option>Cortés</option>
          <option>El Paraíso</option>
          <option>Francisco Morazán</option>
          <option>Gracias a Dios</option>
          <option>Intibucá</option>
          <option>Islas de la Bahía</option>
          <option>La Paz</option>
          <option>Lempira</option>
          <option>Ocotepeque</option>
          <option>Olancho</option>
          <option>Santa Bárbara</option>
          <option>Valle</option>
          <option>Yoro</option>
        </select>
      </div>
      <div class="delivery-methods" role="radiogroup" aria-label="Método de entrega">
        <label class="delivery-opt"><input type="radio" name="delivery" value="domicilio" checked>
          <span>🏠 Envío a domicilio
            <small>✔️ L150 (hasta 5 artículos) · L200 (6 o más) · Depósito previo · 📦 2 a 4 días hábiles</small>
          </span>
        </label>
        <label class="delivery-opt"><input type="radio" name="delivery" value="oficina">
          <span>🏢 Recoger en oficina cercana
            <small>✔️ Gratis · Pago contra entrega</small>
          </span>
        </label>
      </div>
      <h3>💳 Forma de pago</h3>
      <div class="delivery-methods" role="radiogroup" aria-label="Forma de pago">
        <label class="delivery-opt"><input type="radio" name="payment" value="efectivo" checked>
          <span>💵 Efectivo
            <small>✔️ Pago contra entrega (al recibir tu pedido)</small>
          </span>
        </label>
        <label class="delivery-opt"><input type="radio" name="payment" value="deposito">
          <span>🏦 Depósito Banco Atlántida
            <small>✔️ Depósito previo · Envíanos tu comprobante por WhatsApp</small>
          </span>
        </label>
      </div>
    </div>
  </div>
  <div class="drawer-foot">
    <div class="total-row ship-row"><span>Envío</span><strong id="cart-shipping">L0.00</strong></div>
    <div class="total-row"><span>Total</span><strong id="cart-total">L0.00</strong></div>
    <button id="checkout-btn" class="btn-primary">Confirmar pedido ✅</button>
    <p id="checkout-error" class="error hidden"></p>
    <div id="order-success" class="order-success hidden">
      <h3>🎉 ¡Pedido recibido!</h3>
      <p id="order-success-num"></p>
      <p id="order-success-detail"></p>
      <p id="order-success-pay" class="pay-note"></p>
      <button id="order-success-close" class="btn-primary">Seguir comprando</button>
    </div>
  </div>
</div>
<div id="drawer-backdrop" class="backdrop hidden"></div>

<script src="/static/store.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}
</script>
</body>
</html>
